name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: UI registry drift
        run: pnpm ui:drift

      - name: Auth browser smoke contracts
        run: node --test tests/contracts/auth-browser-smoke.test.mjs

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build
