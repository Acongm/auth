# Platform v2 site configuration
# Shared schema with API node-vercel-starter and @acongm/config.

domains:
  portal: https://www.acongm.com
  dochub: https://dochub.acongm.com
  chat: https://chat.acongm.com
  auth: https://auth.acongm.com
  api: https://api.acongm.com

git:
  owner: Acongm
  repo: portal
  contentDir: content/docs
  defaultBranch: master
  publishBranch: master

limits:
  anon:
    chatPerDay: 20
  user:
    chatPerDay: 200

oauth:
  providers:
    - github
  claimThreads: true
